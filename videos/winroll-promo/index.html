<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>WinRoll RS | 20-second product promo</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #FDFDFC; }
    #root { width: 1920px; height: 1080px; position: relative; overflow: hidden; }
    .clip { position: absolute; inset: 0; width: 1920px; height: 1080px; background: #FDFDFC; }
    #scene1 { z-index: 1; }
    #scene2 { z-index: 2; opacity: 0; }
    #scene3 { z-index: 3; opacity: 0; }
    #scene4 { z-index: 4; opacity: 0; }
  </style>
</head>
<body>
  <div data-hf-id="hf-at0g" id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080">
    <audio data-hf-id="hf-8eig" id="narration" src="narration.wav" data-start="0" data-duration="16.213375" data-track-index="0" data-volume="1"></audio>
    <div data-hf-id="hf-1jdv" id="scene1" class="clip" data-composition-id="beat1" data-composition-src="compositions/beat-1.html" data-start="0" data-duration="4.75" data-track-index="1"></div>
    <div data-hf-id="hf-mpsx" id="scene2" class="clip" data-composition-id="beat2" data-composition-src="compositions/beat-2.html" data-start="4.30" data-duration="3.39" data-track-index="2"></div>
    <div data-hf-id="hf-m1bj" id="scene3" class="clip" data-composition-id="beat3" data-composition-src="compositions/beat-3.html" data-start="7.24" data-duration="3.19" data-track-index="3"></div>
    <div data-hf-id="hf-0y7i" id="scene4" class="clip" data-composition-id="beat4" data-composition-src="compositions/beat-4.html" data-start="9.98" data-duration="10.02" data-track-index="4"></div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const mainTimeline = gsap.timeline({ paused: true });
    mainTimeline.to('#scene1', {opacity: 0, duration: .45, ease: 'power2.inOut'}, 4.30);
    mainTimeline.fromTo('#scene2', {opacity: 0}, {opacity: 1, duration: .45, ease: 'power2.inOut', immediateRender: false}, 4.30);
    mainTimeline.to('#scene2', {opacity: 0, duration: .45, ease: 'power2.inOut'}, 7.24);
    mainTimeline.fromTo('#scene3', {opacity: 0}, {opacity: 1, duration: .45, ease: 'power2.inOut', immediateRender: false}, 7.24);
    mainTimeline.to('#scene3', {opacity: 0, duration: .45, ease: 'power2.inOut'}, 9.98);
    mainTimeline.fromTo('#scene4', {opacity: 0}, {opacity: 1, duration: .45, ease: 'power2.inOut', immediateRender: false}, 9.98);
    window.__timelines.main = mainTimeline;
  </script>
</body>
</html>
